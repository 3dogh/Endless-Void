<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>無盡虛空 - Endless Void</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Audiowide&family=Chakra+Petch:wght@400;600;700&family=ZCOOL+QingKe+HuangYou&display=swap');
        
        /* Lock down touch actions to prevent screen moving/zooming on iPad/Mobile */
        html, body {
            font-family: 'Chakra Petch', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050510;
            color: #fff;
            touch-action: none;
            overscroll-behavior: none;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 5, 16, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(5px);
        }

        .hidden { display: none !important; }

        .font-cn { font-family: 'ZCOOL QingKe HuangYou', sans-serif; letter-spacing: 0.05em; }
        .font-en { font-family: 'Audiowide', cursive; }

        .btn {
            background: linear-gradient(45deg, #ec4899, #8b5cf6);
            border: none;
            padding: 15px 40px;
            color: white;
            font-family: 'Audiowide', cursive;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.5);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn:active {
            transform: scale(0.95);
        }

        .btn-hard { background: linear-gradient(45deg, #ef4444, #f59e0b); box-shadow: 0 0 15px rgba(239, 68, 68, 0.5); }
        .btn-easy { background: linear-gradient(45deg, #10b981, #3b82f6); box-shadow: 0 0 15px rgba(16, 185, 129, 0.5); }

        #hud {
            position: absolute;
            top: 15px; left: 15px; right: 15px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 5;
        }

        .hud-text {
            font-family: 'Audiowide', cursive;
            font-size: 1.2rem;
            text-shadow: 0 0 5px #fff;
        }

        .health-bar-bg {
            width: 200px; height: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid #fff;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 5px;
        }
        
        .health-bar-fill {
            width: 100%; height: 100%;
            background: #10b981;
            transition: width 0.2s, background-color 0.2s;
        }

        /* Mobile Controls */
        #mobile-controls {
            position: fixed;
            bottom: 20px;
            left: 0; right: 0;
            height: 240px;
            pointer-events: none;
            z-index: 50;
        }
        
        .touch-btn {
            pointer-events: auto;
            position: absolute;
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Audiowide', cursive;
            font-size: 32px;
            color: rgba(255,255,255,0.6);
            touch-action: none;
        }
        
        .touch-btn:active { background: rgba(255, 255, 255, 0.35); }

        /* Transparent Fire Button */
        #btn-fire {
            right: 25px; bottom: 25px;
            width: 110px; height: 110px;
            background: rgba(244, 63, 94, 0.18);
            border-color: rgba(244, 63, 94, 0.35);
            color: rgba(244, 63, 94, 0.7);
            font-size: 20px; font-weight: bold;
        }
        #btn-fire:active { background: rgba(244, 63, 94, 0.3); }

        /* D-Pad */
        #d-pad { left: 20px; bottom: 15px; width: 240px; height: 240px; position: absolute; pointer-events: none; }
        .d-btn { width: 80px; height: 80px; font-size: 34px; }
        #btn-w { top: 0; left: 80px; }
        #btn-s { bottom: 0; left: 80px; }
        #btn-a { left: 0; top: 80px; }
        #btn-d { right: 0; top: 80px; }

        /* Skin Selector */
        .skin-option { border: 2px solid transparent; cursor: pointer; transition: all 0.2s; }
        .skin-option:hover { transform: translateY(-5px); }
        .skin-selected { border-color: #ec4899; background: rgba(236, 72, 153, 0.2); box-shadow: 0 0 15px rgba(236, 72, 153, 0.5); }
    </style>
</head>
<body>

    <div id="hud" class="hidden">
        <div>
            <div class="health-bar-bg"><div id="healthBar" class="health-bar-fill"></div></div>
            <div class="hud-text text-yellow-400">🪙 <span id="coinDisplay">0</span></div>
        </div>
        <div class="text-right">
            <div class="hud-text text-cyan-400">WAVE <span id="waveDisplay">1</span></div>
            <div class="hud-text text-pink-400">SCORE <span id="scoreDisplay">0</span></div>
            <div class="mt-2 flex justify-end gap-2">
                <button id="toggleControlsBtn" class="bg-gray-800 border border-gray-600 rounded px-2 py-1 text-sm pointer-events-auto" onclick="toggleControls()">🎮 PAD</button>
                <button id="muteBtn" class="bg-gray-800 border border-gray-600 rounded px-2 py-1 text-sm pointer-events-auto" onclick="toggleMute()">🔊 ON</button>
                <button id="exitGameBtn" class="bg-red-950/90 border border-red-500/70 text-red-300 hover:bg-red-900 rounded px-2 py-1 text-sm pointer-events-auto" onclick="returnToMenu()">🏠 EXIT</button>
            </div>
        </div>
    </div>

    <!-- Boss Health Bar HUD -->
    <div id="bossHud" class="hidden fixed top-16 left-1/2 -translate-x-1/2 w-11/12 max-w-md z-10 pointer-events-none flex flex-col items-center">
        <div id="bossNameTitle" class="font-en text-red-500 text-sm md:text-base tracking-widest mb-1 font-bold" style="text-shadow: 0 0 8px rgba(239, 68, 68, 0.8);">⚠️ VOID OVERLORD ⚠️</div>
        <div class="w-full h-4 bg-gray-900/90 border-2 border-red-500 rounded-full overflow-hidden shadow-[0_0_15px_rgba(239,68,68,0.6)]">
            <div id="bossHealthBar" class="h-full bg-gradient-to-r from-red-600 via-orange-500 to-yellow-400 transition-all duration-100" style="width: 100%;"></div>
        </div>
        <div id="bossHealthText" class="font-en text-xs text-red-300 mt-1">100 / 100</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- Mobile Controls -->
    <div id="mobile-controls" class="hidden">
        <div id="d-pad">
            <div id="btn-w" class="touch-btn d-btn">▲</div>
            <div id="btn-a" class="touch-btn d-btn">◀</div>
            <div id="btn-s" class="touch-btn d-btn">▼</div>
            <div id="btn-d" class="touch-btn d-btn">▶</div>
        </div>
        <div id="btn-fire" class="touch-btn">FIRE</div>
    </div>

    <!-- Start Screen -->
    <div id="startScreen" class="overlay">
        <div class="text-center mb-6">
            <h1 class="font-en text-5xl md:text-7xl tracking-[0.2em] text-cyan-300 mb-2" style="filter: drop-shadow(0 0 10px rgba(34,211,238,0.8));">ENDLESS VOID</h1>
            <h2 class="font-cn text-4xl md:text-6xl text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-cyan-500" style="filter: drop-shadow(0 0 8px rgba(236,72,153,0.6));">無盡虛空</h2>
        </div>
